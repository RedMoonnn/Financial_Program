[project]
name = "backend"
version = "0.1.0"
description = "Financial Program Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.0",
    "email-validator>=2.3.0",
    "fastapi>=0.100.0",
    "minio>=7.1.0",
    "openai>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.0.0",
    "pymysql>=1.0.2",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "requests>=2.28.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.20.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.1.6",
]
